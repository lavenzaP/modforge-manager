name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python core checks
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Compile check
        run: python -m compileall -q src tests

      - name: Public staging smoke
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\public_staging_smoke.ps1

