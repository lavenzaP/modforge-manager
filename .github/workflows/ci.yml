name: CI

on:
  push:
  pull_request:

jobs:
  launcher:
    name: Windows launcher checks
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Launcher smoke
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\smoke_launcher.ps1
